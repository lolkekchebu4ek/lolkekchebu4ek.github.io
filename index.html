<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <meta name="description" content="NOIR STUDIO — portfolio landing in Russian and English. Choose your language." />
    <title>NOIR STUDIO | Choose language</title>
    <style>
      :root {
        --bg: #090b10;
        --panel: #121721;
        --panel-strong: #171d2a;
        --text: #f4f5f7;
        --muted: #a5adbb;
        --border: rgba(255,255,255,0.08);
        --accent: #d9a96d;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, rgba(217,169,109,0.13), transparent 35%), var(--bg);
        color: var(--text);
      }
      .shell {
        width: min(720px, calc(100vw - 32px));
        background: rgba(18, 23, 33, 0.82);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: clamp(24px, 4vw, 48px);
        box-shadow: 0 28px 72px rgba(0,0,0,0.35);
      }
      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 11px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1.05;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      .lang-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 16px 22px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--panel-strong);
        color: var(--text);
        text-decoration: none;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        font-weight: 700;
      }
      .lang-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(217,169,109,0.4);
      }
      .lang-btn.primary {
        background: linear-gradient(135deg, rgba(217,169,109,0.2), rgba(255,255,255,0.02));
      }
      .meta {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .meta span {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255,255,255,0.015);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <p class="eyebrow">NOIR STUDIO</p>
      <h1>Choose your language</h1>
      <p>
        This project is presented as a bilingual case study. Choose the version you want to explore:
        Russian for the original narrative and English for the international presentation.
      </p>

      <div class="actions">
        <a class="lang-btn primary" href="/ru/">Русская версия</a>
        <a class="lang-btn" href="/en/">English version</a>
      </div>

      <div class="meta">
        <span>Portfolio case study</span>
        <span>Mobile-first</span>
        <span>RU / EN</span>
      </div>
    </div>
  </body>
</html>
